<!--
  Custom title banner for print project pages.
  filters/include-title.lua renders this template with the shared project title and subtitle and the page's own categories.
-->

<header id="title-block-header" class="quarto-title-block default project-banner mb-0 page-columns">

  <div class="project-banner-content">

      <div class="quarto-title">

        $if(categories)$
          <div class="quarto-categories projectlinks">
            <a href="/3Dprints.html">3Dprints > </a>
            $for(categories)$
              <div class="quarto-category">$categories$ / </div>
            $endfor$
          </div>
        $endif$

        $if(title)$
          <h1 class="title display-3 fw-bold">$title$</h1>
        $endif$

        $if(subtitle)$
          <div class="subtitle fs-3 fw-medium">$subtitle$</div>
        $endif$

      </div>

  </div>

</header>
