<header id="title-block-header" class="quarto-title-block default homepage-banner">

  <div class="quarto-title">
    <div class="row align-items-center g-4">

      <div class="col-md-8">

        $if(banner.eyebrow)$
        <p class="homepage-banner-eyebrow mb-3">
          &gt; $banner.eyebrow$
        </p>
        $endif$

        $if(title)$
        <h1 class="title display-3 fw-bold">$title$</h1>
        $endif$

        $if(subtitle)$
        <div class="subtitle fs-3 fw-medium">$subtitle$</div>
        $endif$

        $if(banner.line)$
        <p class="homepage-banner-line mb-3">
          $banner.line$
        </p>
        $endif$

        $if(description)$
        <div class="description fs-5 fw-normal opacity-75">
          $description$
        </div>
        $endif$

      </div>

    </div>
  </div>

</header>
