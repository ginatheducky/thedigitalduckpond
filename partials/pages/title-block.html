<header id="title-block-header" class="quarto-title-block default page-banner page-columns">

  <div class="page-banner-content">

    <div class="quarto-title">

        $if(banner.eyebrow)$
        <p class="page-banner-eyebrow mb-2">
          &gt; $banner.eyebrow$
        </p>
        $endif$

        $if(title)$
        <h1 class="title display-3 fw-bold">$title$</h1>
        $endif$

        $if(description)$
        <div class="description">
          $description$
        </div>
        $endif$

    </div>
  </div>

</header>
