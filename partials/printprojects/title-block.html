<header id="title-block-header" class="quarto-title-block default print-banner">

  <div class="quarto-title">
    <div class="row align-items-center g-4">

      <div class="col-md-8">

        $if(categories)$
        <div class="">
            $for(categories)$
            <div class="">$categories$</div>
            $endfor$
        </div>
        $endif$

        $if(title)$
        <h1 class="title display-3 fw-bold">$title$</h1>
        $endif$

        $if(subtitle)$
        <div class="subtitle">
          $subtitle$
        </div>
        $endif$

      </div>

    </div>
  </div>

</header>
