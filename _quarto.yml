project:
  type: website
  output-dir: _site

website:
  site-url: https://thedigitalduckpond.com
  title: "thedigitalduckpond"
  cookie-consent: 
    type: express
  navbar:
    search: false
    right:
      - href: blog.qmd
        text: Blog
      - href: 3Dprints.qmd
        text: 3Dprints
      - href: about.qmd
        text: About
  page-footer:
    left: "© 2026 The Digital Duck Pond"
    center:
      - text: "Legal Notice"
        href: content\pages\legal-notice.qmd
      - text: "Privacy Policy"
        href: content\pages\privacy-policy.qmd
    right: "Made with ♥ and [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [sketchy, custom.scss, brand]
      dark: [sketchy, custom.scss, brand]
    css: styles.css
    toc: true
    html-math-method: mathml
    shortcodes:
      - shortcodes/insert-print-download-card.lua
      - shortcodes/project-details.lua
      - shortcodes/project-banner.lua
      - shortcodes/project-highlights.lua

execute: 
  freeze: auto



